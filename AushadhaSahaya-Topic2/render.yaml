# Copy to /render.yaml at repo root
services:
  - type: web
    name: aushadhasahaya-api
    runtime: python
    rootDir: AushadhaSahaya-Topic2
    startCommand: "python3 server.py"
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 10000
    healthCheckPath: /healthz

  - type: web
    name: aushadhasahaya-static
    runtime: static
    rootDir: AushadhaSahaya-Topic2
    staticPublishPath: ./web
    pullRequestPreviewsEnabled: true
